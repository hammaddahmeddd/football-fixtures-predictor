
name: Refresh Football Predictions

# =====================================================
# WORKFLOW TRIGGERS
# =====================================================

on:
  schedule:
    # Daily at 7:17 AM Pakistan time
    - cron: "17 2 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

# =====================================================
# PERMISSIONS
# =====================================================

permissions:
  contents: write

# =====================================================
# CONCURRENCY CONTROL
# =====================================================

concurrency:
  group: football-refresh-${{ github.ref }}
  cancel-in-progress: false

# =====================================================
# AUTOMATIC REFRESH JOB
# =====================================================

jobs:

  refresh:

    name: Update Football Predictions

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg

    steps:

      # ===============================================
      # STEP 1: CHECKOUT REPOSITORY
      # ===============================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===============================================
      # STEP 2: SET UP PYTHON
      # ===============================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements.txt

      # ===============================================
      # STEP 3: INSTALL DEPENDENCIES
      # ===============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ===============================================
      # STEP 4: VERIFY API KEY
      # ===============================================

      - name: Verify API credentials
        run: |
          python -c "
          import os

          if not os.getenv('FOOTBALL_API_KEY'):
              raise RuntimeError('FOOTBALL_API_KEY secret is missing.')

          print('Football API credentials available.')
          "

      # ===============================================
      # STEP 5: VERIFY TRAINED MODELS
      # ===============================================

      - name: Verify trained models
        run: |
          python -c "
          from pathlib import Path

          required_models = [
              'knn.joblib',
              'svm.joblib',
              'decision_tree.joblib',
              'random_forest.joblib',
              'best_classifier.joblib',
              'goal_regressor.joblib',
              'over_under_classifier.joblib',
              'q_learning_policy.joblib',
              'feature_columns.joblib'
          ]

          for model in required_models:
              path = Path('models') / model

              if not path.exists():
                  raise FileNotFoundError(f'Missing model: {model}')

              print(f'Found model: {model}')
          "

      # ===============================================
      # STEP 6: UPDATE WEEKLY MATCH PREDICTIONS
      # ===============================================

      - name: Generate weekly predictions
        run: |
          echo "Fetching latest football fixtures..."
          python -m src.predictions
          echo "Weekly predictions completed."

      # ===============================================
      # STEP 7: UPDATE FULL-SEASON SIMULATION
      # ===============================================

      - name: Update season projections
        run: |
          echo "Running Monte Carlo season simulation..."
          python -m src.season_simulation
          echo "Season simulation completed."
                - name: Update prediction history
        run: |
          echo "Updating live prediction history..."
          python -m src.prediction_history

      # ===============================================
      # STEP 8: RUN AUTOMATED TESTS
      # ===============================================

      - name: Validate project outputs
        run: |
          echo "Running automated project tests..."
          python -m pytest tests/ -v

      # ===============================================
      # STEP 9: COMMIT UPDATED DATA
      # ===============================================

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/
          git add data/predictions/
          git add outputs/metrics/
          git add outputs/graphs/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Automatically refresh football predictions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # ===============================================
      # STEP 10: SUCCESS MESSAGE
      # ===============================================

      - name: Refresh completed
        if: success()
        run: |
          echo "========================================"
          echo "FOOTBALL PREDICTION REFRESH SUCCESSFUL"
          echo "========================================"
          echo "Latest match results collected."
          echo "Weekly predictions updated."
          echo "Season projections updated."
          echo "Automated tests passed."
          echo "Updated data pushed to GitHub."

      # ===============================================
      # STEP 11: FAILURE MESSAGE
      # ===============================================

      - name: Refresh failed
        if: failure()
        run: |
          echo "========================================"
          echo "FOOTBALL PREDICTION REFRESH FAILED"
          echo "========================================"
          echo "Review the failed step in GitHub Actions."
          echo "Existing deployed predictions remain unchanged."

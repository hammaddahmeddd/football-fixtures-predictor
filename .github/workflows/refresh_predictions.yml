
name: Refresh Football Predictions

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Update Football Predictions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify API credentials
        run: |
          python -c "import os; assert os.getenv('FOOTBALL_API_KEY'), 'Missing FOOTBALL_API_KEY secret'"

      - name: Verify trained models
        run: |
          python - <<'PY'
          from pathlib import Path

          models = [
              "knn.joblib",
              "svm.joblib",
              "decision_tree.joblib",
              "random_forest.joblib",
              "best_classifier.joblib",
              "goal_regressor.joblib",
              "over_under_classifier.joblib",
              "q_learning_policy.joblib",
              "feature_columns.joblib"
          ]

          for model in models:
              path = Path("models") / model
              assert path.exists(), f"Missing model: {model}"
              print(f"Found: {model}")
          PY

      - name: Generate weekly predictions
        run: python -m src.predictions

      - name: Update season projections
        run: python -m src.season_simulation

      - name: Update prediction history
        run: python -m src.prediction_history

      - name: Validate project outputs
        run: python -m pytest tests/ -v

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/
          git add data/predictions/
          git add outputs/metrics/
          git add outputs/graphs/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Automatically refresh football predictions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Refresh completed
        if: success()
        run: |
          echo "Football prediction refresh successful."
          echo "Automated tests passed."

      - name: Refresh failed
        if: failure()
        run: |
          echo "Football prediction refresh failed."
          echo "Review the failed step in GitHub Actions."

name: Refresh V4 shadow predictions
on:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * *'
permissions:
  contents: write
concurrency:
  group: v4-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/accuracy-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accuracy-v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Refresh V4
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m src.refresh_v4
      - name: Commit generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/v4_production/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh V4 predictions and live evaluation'
          git push origin HEAD:accuracy-v3


services:
  - type: web
    name: football-fixtures-predictor
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: >-
      python -m streamlit run app.py
      --server.address 0.0.0.0
      --server.port $PORT
      --server.headless true

    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
